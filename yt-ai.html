<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security YouTube — curated channels</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --card2:#1e222b; --fg:#e6e8ee; --dim:#8b93a5;
          --accent:#6366f1; --star:#f59e0b; --done:#10b981; --border:#262b36; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           border-bottom:1px solid var(--border); padding:14px 22px;
           display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  header input[type=search] { background:var(--card); color:var(--fg);
      border:1px solid var(--border); border-radius:8px; padding:8px 12px; width:240px; }
  .tabs button { background:var(--card); color:var(--dim); border:1px solid var(--border);
      padding:7px 14px; border-radius:8px; cursor:pointer; margin-right:6px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .io { margin-left:auto; display:flex; gap:6px; }
  .io button, .io label { background:var(--card); color:var(--dim); border:1px solid var(--border);
      padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
          gap:16px; padding:22px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px;
          overflow:hidden; display:flex; flex-direction:column; transition:opacity .15s; }
  .card.done { opacity:.45; }
  .card.star { border-color:var(--star); box-shadow:0 0 0 1px var(--star); }
  .top { display:flex; gap:12px; padding:14px; align-items:center; }
  .top img { width:64px; height:64px; border-radius:50%; object-fit:cover;
             background:var(--card2); flex:none; }
  .top .meta { min-width:0; }
  .top a.name { color:var(--fg); font-weight:600; font-size:16px; text-decoration:none;
                display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top a.name:hover { color:var(--accent); }
  .counts { color:var(--dim); font-size:13px; margin-top:2px; }
  .badges { margin-left:auto; display:flex; flex-direction:column; gap:6px; flex:none; }
  .badges button { width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
      background:var(--card2); cursor:pointer; font-size:17px; line-height:1;
      filter:grayscale(1); opacity:.55; }
  .badges button.on { filter:none; opacity:1; }
  .badges button.b-star.on { border-color:var(--star); background:#2a2110; }
  .badges button.b-done.on { border-color:var(--done); background:#0d241c; }
  details { border-top:1px solid var(--border); }
  details summary { cursor:pointer; padding:9px 14px; color:var(--dim); font-size:13px;
                    user-select:none; list-style:none; }
  details summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }
  details ul { margin:0; padding:0 14px 12px 22px; max-height:230px; overflow:auto; }
  details li { font-size:13px; margin:4px 0; }
  details a { color:#a5b4fc; text-decoration:none; }
  details a:hover { text-decoration:underline; }
  .notes { color:var(--dim); }
  #empty { color:var(--dim); padding:40px; text-align:center; display:none; }
  footer { color:var(--dim); font-size:12px; padding:8px 22px 24px; }
</style>
</head>
<body>
<header>
  <h1>🛡️ Security channels — curated</h1>
  <input type="search" id="q" placeholder="search channels…">
  <span class="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="star">⭐ Starred</button>
    <button data-f="todo">Todo</button>
    <button data-f="done">✓ Done</button>
  </span>
  <span class="io">
    <button id="exp">Export state</button>
    <label>Import<input type="file" id="imp" accept=".json" hidden></label>
  </span>
</header>
<div id="grid"></div>
<div id="empty">Nothing matches.</div>
<footer>Curated by ~/dotfiles/bin/yt-ai — star/done state is shared with yt-channels.html, saved

e77p7XHXPNATL28nuHXGn0Bji-YB4Zfd4l_GmRF3Q=s900-c-k-c0x00ffffff-no-rj", "desc": "conference talks · 9.59K subs", "videos": [], "playlists": [], "notes": ["Security Fest (in your notes)"]}, {"name": "44CON Information Security Conference", "url": "https://www.youtube.com/@44contv", "avatar": "https://yt3.googleusercontent.com/ytc/AIdro_kZPxCGSs2v-0RXc-ILuNqcWke0gwm0zaviAFFDXj18jw=s900-c-k-c0x00ffffff-no-rj", "desc": "conference talks · 5.48K subs", "videos": [], "playlists": [], "notes": ["44CON London"]}, {"name": "Wild West Hackin&#39; Fest", "url": "https://www.youtube.com/@WildWestHackinFest", "avatar": "https://yt3.googleusercontent.com/ytc/AIdro_ljjFPD2HcfDUbI1vV-t4FQIiB_YGgBohUqO4zdjfX7cVA=s900-c-k-c0x00ffffff-no-rj", "desc": "conference talks · 56.8K subs", "videos": [], "playlists": [], "notes": ["WWHF talks"]}, {"name": "BSidesLV", "url": "https://www.youtube.com/@BsideslvOrg", "avatar": "https://yt3.googleusercontent.com/FngV29HR2IwrjZI96nX0IWxMd0G8x4-sFIrlSfU17LaHx2v860HNOMkKCje_z1nUFW2a6G2Nk3o=s900-c-k-c0x00ffffff-no-rj", "desc": "conference talks · 5.34K subs", "videos": [], "playlists": [], "notes": ["BSides Las Vegas"]}, {"name": "Ebrahem", "url": "https://www.youtube.com/@Zigoo0", "avatar": "https://yt3.googleusercontent.com/ytc/AIdro_na2IVjWCbShQCWauJvq2BlaEN-hj2wSTiN_FwsxUdomuE=s900-c-k-c0x00ffffff-no-rj", "desc": "arabic · 117K subs", "videos": [], "playlists": [], "notes": ["Ebrahim Hegazy — Arabic web sec & bug bounty"]}, {"name": "BlackSilence", "url": "https://www.youtube.com/@BlacKSilence12", "avatar": "https://yt3.googleusercontent.com/oouEl6dB-hLP-O1scbt4ETrQutM1wXR3sWfxdEC9wWn0IGXnidWvxNOsw2j2sUS-O_vP3Qc9=s900-c-k-c0x00ffffff-no-rj", "desc": "arabic · 6.95K subs", "videos": [], "playlists": [], "notes": ["Arabic RE & malware analysis"]}, {"name": "CyberTalents", "url": "https://www.youtube.com/@CyberTalents", "avatar": "https://yt3.googleusercontent.com/ytc/AIdro_kuougIUgK7h_HmUCSWSvRjYHc_-dgHdqN2yywZ4QRqGvA=s900-c-k-c0x00ffffff-no-rj", "desc": "arabic · 7.28K subs", "videos": [], "playlists": [], "notes": ["Arab CTF platform; talks & finals"]}];
const LSKEY = "ytch-state-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(LSKEY)) || {}; } catch (e) {}
let filter = "all", query = "";

const save = () => localStorage.setItem(LSKEY, JSON.stringify(state));
const st = k => state[k] || {};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(c) {
  const key = c.url.toLowerCase();
  const s = st(key);
  const n = c.videos.length, p = c.playlists.length;
  const counts = [n && `${n} video${n>1?"s":""}`, p && `${p} playlist${p>1?"s":""}`]
      .filter(Boolean).join(" · ") || esc(c.desc || "");
  const items = [...c.playlists.map(v => ({...v, pl:true})), ...c.videos];
  const list = items.map(v =>
      `<li>${v.pl ? "🗂 " : ""}<a href="${esc(v.url)}" target="_blank">${esc(v.title)||"(untitled)"}</a></li>`
    ).join("");
  return `<div class="card ${s.done?"done":""} ${s.star?"star":""}" data-key="${esc(key)}">
    <div class="top">
      <img loading="lazy" src="${esc(c.avatar)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="meta">
        <a class="name" href="${esc(c.url)}" target="_blank">${esc(c.name)}</a>
        <div class="counts">${counts}</div>
      </div>
      <div class="badges">
        <button class="b-star ${s.star?"on":""}" title="star">⭐</button>
        <button class="b-done ${s.done?"on":""}" title="done">✅</button>
      </div>
    </div>
    ${items.length ? `<details><summary>saved links (${items.length})</summary><ul>${list}</ul></details>` : ""}
    <details><summary>why watch</summary>
      <ul class="notes">${c.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
  </div>`;
}

function visible(c) {
  const s = st(c.url.toLowerCase());
  if (filter === "star" && !s.star) return false;
  if (filter === "done" && !s.done) return false;
  if (filter === "todo" && (s.done || s.star)) return false;
  if (query && !(c.name + " " + (c.desc || "") + " " + c.notes.join(" ")).toLowerCase().includes(query)) return false;
  return true;
}

function render() {
  const rows = DATA.filter(visible);
  document.getElementById("grid").innerHTML = rows.map(card).join("");
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
}

document.getElementById("grid").addEventListener("click", e => {
  const b = e.target.closest(".badges button");
  if (!b) return;
  const key = b.closest(".card").dataset.key;
  const field = b.classList.contains("b-star") ? "star" : "done";
  state[key] = {...st(key), [field]: !st(key)[field]};
  save(); render();
});
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.toLowerCase(); render();
});
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
}));
document.getElementById("exp").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}));
  a.download = "yt-channels-state.json"; a.click();
});
document.getElementById("imp").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { state = JSON.parse(t); save(); render(); });
});
render();
</script>
