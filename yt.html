<title>YouTube channels — vault board</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --card2:#1e222b; --fg:#e6e8ee;
          --dim:#8b93a5; --accent:#6366f1; --star:#f59e0b; --done:#10b981;
          --border:#262b36; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           border-bottom:1px solid var(--border); padding:14px 22px;
           display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  header input[type=search] { background:var(--card); color:var(--fg);
      border:1px solid var(--border); border-radius:8px; padding:8px 12px;
      width:240px; }
  .tabs button { background:var(--card); color:var(--dim);
      border:1px solid var(--border); padding:7px 14px; border-radius:8px;
      cursor:pointer; margin-right:6px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#fff;
      border-color:var(--accent); }
  .io { margin-left:auto; display:flex; gap:6px; }
  .io button, .io label { background:var(--card); color:var(--dim);
      border:1px solid var(--border); padding:7px 12px; border-radius:8px;
      cursor:pointer; font-size:13px; }
  #grid { display:grid;
          grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
          gap:16px; padding:22px; }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:14px; overflow:hidden; display:flex;
          flex-direction:column; transition:opacity .15s; }
  .card.done { opacity:.45; }
  .card.star { border-color:var(--star); box-shadow:0 0 0 1px var(--star); }
  .top { display:flex; gap:12px; padding:14px; align-items:center; }
  .top img { width:64px; height:64px; border-radius:50%; object-fit:cover;
             background:var(--card2); flex:none; }
  .top .meta { min-width:0; }
  .top a.name { color:var(--fg); font-weight:600; font-size:16px;
                text-decoration:none; display:block; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  .top a.name:hover { color:var(--accent); }
  .counts { color:var(--dim); font-size:13px; margin-top:2px; }
  .badges { margin-left:auto; display:flex; flex-direction:column;
            gap:6px; flex:none; }
  .badges button { width:38px; height:38px; border-radius:10px;
      border:1px solid var(--border); background:var(--card2);
      cursor:pointer; font-size:17px; line-height:1;
      filter:grayscale(1); opacity:.55; }
  .badges button.on { filter:none; opacity:1; }
  .badges button.b-star.on { border-color:var(--star); background:#2a2110; }
  .badges button.b-done.on { border-color:var(--done); background:#0d241c; }
  .why { border-top:1px solid var(--border); padding:11px 14px;
         font-size:13.5px; color:var(--fg); line-height:1.5; }
  .why-q { color:var(--accent); font-weight:700; margin-right:4px; }
  #empty { color:var(--dim); padding:40px; text-align:center; display:none; }
  footer { color:var(--dim); font-size:12px; padding:8px 22px 24px; }
</style>
</head>
<body>
<header>
  <h1>📺 YouTube channels</h1>
  <input type="search" id="q" placeholder="search channels…">
  <span class="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="star">⭐ Starred</button>
    <button data-f="todo">Todo</button>
    <button data-f="done">✓ Done</button>
    <button data-f="notes">📓 Notes</button>
    <button data-f="curated">🛡️ Curated</button>
  </span>
  <span class="io">
    <button id="exp">Export state</button>
    <label>Import<input type="file" id="imp" accept=".json" hidden></label>
  </span>
</header>
<div id="grid"></div>
<div id="empty">Nothing matches.</div>
<footer>Squashed from yt-channels.html (📓 from /src/notes) and yt-ai.html
(🛡️ curated security) — star/done state is saved in this browser
(localStorage) and survives rebuilds. Use Export/Import to move it.</footer>

const LSKEY = "ytch-state-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(LSKEY)) || {}; } catch (e) {}
let filter = "all", query = "";

const save = () => localStorage.setItem(LSKEY, JSON.stringify(state));
const st = k => state[k] || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(c) {
  const key = c.url.toLowerCase();
  const s = st(key);
  const counts = c.desc ? esc(c.desc) : "";
  const cls = `card ${s.done ? "done" : ""} ${s.star ? "star" : ""}`;
  const avatar = c.avatar
    ? `<img loading="lazy" src="${esc(c.avatar)}" alt=""
         onerror="this.style.visibility='hidden'">`
    : `<img alt="" style="visibility:hidden">`;
  const why = c.why
    ? `<div class="why"><span class="why-q">why?</span> ${esc(c.why)}</div>`
    : "";
  return `<div class="${cls}" data-key="${esc(key)}">
    <div class="top">
      ${avatar}
      <div class="meta">
        <a class="name" href="${esc(c.url)}" target="_blank">${esc(c.name)}</a>
        ${counts ? `<div class="counts">${counts}</div>` : ""}
      </div>
      <div class="badges">
        <button class="b-star ${s.star?"on":""}" title="star">⭐</button>
        <button class="b-done ${s.done?"on":""}" title="done">✅</button>
      </div>
    </div>
    ${why}
  </div>`;
}

function visible(c) {
  const s = st(c.url.toLowerCase());
  if (filter === "star" && !s.star) return false;
  if (filter === "done" && !s.done) return false;
  if (filter === "todo" && (s.done || s.star)) return false;
  if ((filter === "notes" || filter === "curated") &&
      !(c.src || []).includes(filter)) return false;
  if (query) {
    const hay = [c.name, c.url, c.desc, c.why]
      .filter(Boolean).join(" ").toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

function render() {
  const rows = DATA.filter(visible);
  document.getElementById("grid").innerHTML = rows.map(card).join("");
  document.getElementById("empty").style.display =
    rows.length ? "none" : "block";
}

document.getElementById("grid").addEventListener("click", e => {
  const b = e.target.closest(".badges button");
  if (!b) return;
  const key = b.closest(".card").dataset.key;
  const field = b.classList.contains("b-star") ? "star" : "done";
  state[key] = {...st(key), [field]: !st(key)[field]};
  save(); render();
});
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.toLowerCase(); render();
});
document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button")
      .forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  }));
document.getElementById("exp").addEventListener("click", () => {
  const a = document.createElement("a");
  const blob = new Blob([JSON.stringify(state, null, 2)],
                        {type:"application/json"});
  a.href = URL.createObjectURL(blob);
  a.download = "yt-channels-state.json"; a.click();
});
document.getElementById("imp").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { state = JSON.parse(t); save(); render(); });
});
render();
</script>
</body>
</html>
